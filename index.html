.btn{

align-items:center;

.foodpic{

background:#f2eee5;

.meal .info{flex:1}

.kcal{

.circle{

height:105px;

place-items:center;

.backlink{

.food-search{

.radio input{

.compare{

.tag{

.footer-note{

width:38px;
height:38px;
border-radius:12px;
background:#f0f8f4;

.menu-item{

.menu-item:hover,

color:#1ca66c

.menu-item .mi{

}

.menu-profile{
background:#f7fbf9;

padding:12px;

.menu-profile b{
display:block

.menu-switch{

gap:7px;
margin-top:9px

.menu-switch button{
flex:1;
padding:8px;
border-radius:10px;
background:#fff;
border:1px solid #dce8e3;
color:#5f716b;
font-size:11px;
font-weight:800

.menu-switch button.active{
background:#eaf9f1;
border-color:#86d8b2;
color:#1ca66c

@keyframes menuIn{
from{
transform:translateX(18px);
opacity:.5

to{
transform:translateX(0);
opacity:1
}
}

@media(min-width:700px){
body{padding:20px}
.shell{
border-radius:25px;
overflow:hidden
}

</style>

]

let db=load();

let route=db.initialized?'home':'welcome';

function load(){
try{
return JSON.parse(localStorage.getItem(KEY))||
{
initialized:false,
mode:'single',
current:0,
users:[]
}
}catch{
return{
initialized:false,
mode:'single',
current:0,
users:[]
}
}
}

function save(){
localStorage.setItem(KEY,JSON.stringify(db))
}

function today(){
return new Date().toISOString().slice(0,10)
}

function esc(s){
return String(s??'').replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m])
)
}

function toast(t){
const x=document.getElementById('toast');
x.textContent=t;
x.classList.add('show');
setTimeout(()=>x.classList.remove('show'),1800)
}

function user(){
return db.users[db.current]
}

function metrics(u){

let bmr=u.gender==='male'
?10*u.weight+6.25*u.height-5*u.age+5
:10*u.weight+6.25*u.height-5*u.age-161;

let tdee=bmr*(+u.activity||1.375);

let target=
u.goal==='lose'
?tdee-300
:u.goal==='gain'
?tdee+250
:tdee;

let min=u.gender==='male'?1500:1200;

target=Math.max(
min,
Math.round(target/10)*10
);

return{
bmi:u.weight/((u.height/100)**2),
bmr,
tdee,
target,
water:Math.min(
3.5,
Math.max(
1.5,
Math.round(u.weight*.035*4)/4
)
)
}
}

function dayData(u,d=today()){

u.days??={};

u.days[d]??={
water:0,
meals:[],
workouts:[],
completed:false
};

return u.days[d]
}

function kcal(u){
return dayData(u).meals.reduce(
(a,b)=>a+b.kcal,
0
)
}

function render(){

document.getElementById('screen').innerHTML=
routes[route]();

mountMenu();

const ov=document.getElementById('menuOverlay');

if(ov)
ov.classList.remove('show')
}

function toggleMenu(force){

const el=document.getElementById('menuOverlay');

if(!el)return;

const show=
force===undefined
?!el.classList.contains('show')
:force;

el.classList.toggle('show',show)
}

function closeMenu(){
toggleMenu(false)
}

function menuPage(r){
closeMenu();
go(r)
}

function saveFood(){

let name=
document
.getElementById('foodName')
.value
.trim();

let g=
+document
.getElementById('grams')
.value
||0;

let f=
foods.find(
x=>
x.name.toLowerCase()
===
name.toLowerCase()
)
||
foods.find(
x=>
name.toLowerCase()
.includes(
x.name.toLowerCase()
)
||
x.name.toLowerCase()
.includes(
name.toLowerCase()
)
);

if(!f&&g){

f={
name,
kcal:100,
icon:'🍽️'
}

}

if(!f||g<=0)

return toast(
'Chọn món và nhập số gram'
);

let c=
Math.round(
f.kcal*g/100
);

dayData(user())
.meals
.push({
name:f.name,
grams:g,
kcal:c
});

save();

window.chosenFood=null;

toast(
`Đã thêm ${c} kcal`
);

go('journal')

}
